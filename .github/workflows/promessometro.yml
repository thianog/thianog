name: Promessômetro

on:
  push:
    paths: ["promessometro/**", ".github/workflows/promessometro.yml"]
  pull_request:
    paths: ["promessometro/**", ".github/workflows/promessometro.yml"]

defaults:
  run:
    working-directory: promessometro

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promessometro
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: promessometro_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://promessometro:teste@localhost:5432/promessometro_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promessometro/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm run build
